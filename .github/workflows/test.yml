# Runs every test on each push and pull request. A change is only safe to paste into
# Apps Script when this is green (see docs/CHANGING_THE_CODE.md).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # page_test.js finds the runner's Google Chrome at /usr/bin/google-chrome.
      - run: npm test
